<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Mini Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Lato:wght@300;400;700&family=Great+Vibes&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/pagegame.css">
    <link rel="stylesheet" href="assets/css/next-button.css">
</head>
<body class="pagegame-body">
    <script src="assets/js/page-transition.js"></script>

    <div class="ambient-glow"></div>
    <div class="stars" id="stars"></div>

    <main class="page">
        <header class="header">
            <h1>Pop the Balloons!</h1>
            <p>&middot; pecahkan balon sebanyak mungkin &middot;</p>
        </header>

        <div class="hud">
            <div class="hud-item">
                <span class="hud-label">SKOR</span>
                <span class="hud-value" id="scoreValue">0</span>
            </div>
            <div class="hud-item">
                <span class="hud-label">TARGET</span>
                <span class="hud-value hud-target" id="targetValue">15</span>
            </div>
            <div class="hud-item">
                <span class="hud-label">WAKTU</span>
                <span class="hud-value" id="timeValue">30</span>
            </div>
        </div>

        <div class="progress-track">
            <div class="progress-fill" id="timeFill"></div>
        </div>

        <div class="game-area" id="gameArea">
            <div class="game-hint" id="gameHint">Tap balonnya sayang!</div>
        </div>

        <a href="page8.html" class="next-btn nav-btn skip-btn" id="skipBtn">
            <span class="nav-btn__heart" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="#ffffff">
                    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                </svg>
            </span>
            <span class="nav-btn__label">Lewati Game</span>
            <span class="nav-btn__heart" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="#ffffff">
                    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                </svg>
            </span>
        </a>
    </main>

    <div class="result-overlay" id="resultOverlay">
        <div class="result-card">
            <div class="result-emoji" id="resultEmoji">🎉</div>
            <h2 class="result-title" id="resultTitle"></h2>
            <p class="result-sub" id="resultSub"></p>
            <button class="nav-btn retry-btn" id="retryBtn" type="button" style="display:none">
                <span class="nav-btn__heart" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="#ffffff">
                        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                    </svg>
                </span>
                <span class="nav-btn__label">Main Lagi</span>
                <span class="nav-btn__heart" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="#ffffff">
                        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                    </svg>
                </span>
            </button>
        </div>
    </div>

    <script src="assets/js/pagegame.js"></script>
    <script src="assets/js/heart-bg.js"></script>
</body>
</html>
