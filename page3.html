<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>A Love Letter For You</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Lato:wght@300;400;700&family=Great+Vibes&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/page3.css">
    <link rel="stylesheet" href="assets/css/next-button.css">
</head>
<body class="page3-body">
    <script src="assets/js/page-transition.js"></script>

    <!-- Animasi background -->
    <div class="ambient-glow"></div>
    <div class="sparkle-container" id="sparkles3"></div>
    <div class="heart-rain" id="heartRain3"></div>

    <main class="letter-container">
        <!-- Galeri polaroid: kiri | teks tengah | kanan -->
        <div class="polaroid-gallery">
            <div class="polaroid-left">
                <div class="polaroid" style="--rot: -5deg; --y: -15px;" data-index="1">
                    <div class="polaroid-image">
                        <img src="assets/images/WhatsApp Image 2026-10-18 at 10.34.46 (1).jpeg" alt="Momen romantis" loading="lazy">
                    </div>
                    <span class="polaroid-caption">Our Moment</span>
                </div>
                <div class="polaroid" style="--rot: -2deg; --y: -8px;" data-index="2">
                    <div class="polaroid-image">
                        <img src="assets/images/WhatsApp Image 2026-10-18 at 10.34.46.jpeg" alt="Momen bersama" loading="lazy">
                    </div>
                    <span class="polaroid-caption">Together</span>
                </div>
                <div class="polaroid" style="--rot: 1deg; --y: 0px;" data-index="3">
                    <div class="polaroid-image">
                        <img src="assets/images/WhatsApp Image 2026-10-18 at 10.34.48 (1).jpeg" alt="Cinta sejati" loading="lazy">
                    </div>
                    <span class="polaroid-caption">True Love</span>
                </div>
            </div>

            <div class="letter-text">
                <div class="ornament">
                    <span class="ornament-dot">✦</span>
                    <span class="ornament-line"></span>
                    <span style="font-size: 1.05rem; letter-spacing: 6px; color: #ffb3c6; text-transform: uppercase; font-weight: 400;">A LOVE LETTER</span>
                    <span class="ornament-line"></span>
                    <span class="ornament-dot">✦</span>
                </div>
                <h1 class="main-title">FOTO FOTONYA BIDADARIKUUUU<br></h1>
                <h2 class="special-day">Your Special Day</h2>
                <p class="created-with">Created with love, just for my princesss</p>
            </div>

            <div class="polaroid-right">
                <div class="polaroid" style="--rot: -1deg; --y: 0px;" data-index="4">
                    <div class="polaroid-image">
                        <img src="assets/images/WhatsApp Image 2026-10-18 at 10.34.45 (1).jpeg">
                    </div>
                    <span class="polaroid-caption">Sweet Smile</span>
                </div>
                <div class="polaroid" style="--rot: 2deg; --y: -8px;" data-index="5">
                    <div class="polaroid-image">
                        <img src="assets/images/WhatsApp Image 2026-10-18 at 10.34.45 (2).jpeg">
                    </div>
                    <span class="polaroid-caption">Romantic</span>
                </div>
                <div class="polaroid" style="--rot: 5deg; --y: -15px;" data-index="6">
                    <div class="polaroid-image">
                        <img src="assets/images/WhatsApp Image 2026-10-18 at 10.34.45.jpeg" alt="Wajah manis" loading="lazy">
                    </div>
                    <span class="polaroid-caption">My Love</span>
                </div>
            </div>
        </div>

        <!-- Tombol next ke halaman berikutnya -->
        <button class="next-btn nav-btn" id="nextBtn">
            <span class="nav-btn__heart" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="#ffffff">
                    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                </svg>
            </span>
            <span class="nav-btn__label">Mari Kita Mulai Sayaangggg</span>
            <span class="nav-btn__heart" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="#ffffff">
                    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                </svg>
            </span>
        </button>

    </main>

    <script src="assets/js/page3.js"></script>
    <script src="assets/js/heart-bg.js"></script>
</body>
</html>
