<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>With All My Love</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Lato:wght@300;400;700&family=Great+Vibes&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/page8.css">
</head>
<body class="page8-body">
    <script src="assets/js/page-transition.js"></script>

    <div class="ambient-glow"></div>
    <div class="stars" id="stars"></div>

    <main class="page">
        <div class="subtitle">&#10022; a little message from my heart &#10022;</div>

        <div class="main-title">
            <span id="typingText"></span>
        </div>

        <div class="message">
            <p>Thank you for being part of my life.</p>
            <p>I hope this little gift can make your special day even more beautiful.</p>
            <div class="signature">
                Forever yours.
                <span class="heart">&#10084;&#65039;</span>
            </div>
        </div>

        <div class="bottom-note">Made with love &#9829;</div>
    </main>

    <div class="dark-overlay" id="darkOverlay">
        <span class="overlay-text">I love you so much</span>
    </div>

    <script src="assets/js/page8.js"></script>
    <script src="assets/js/heart-bg.js"></script>
</body>
</html>
