<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Birthday Cake</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Lato:wght@300;400;700&family=Great+Vibes&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/pagecake.css">
    <link rel="stylesheet" href="assets/css/next-button.css">
</head>
<body class="pagecake-body">
    <script src="assets/js/page-transition.js"></script>

    <div class="ambient-glow"></div>
    <div class="stars" id="stars"></div>

    <main class="page">
        <header class="header">
            <h1>Satu Permintaan</h1>
            <p>&middot; birthday cake untukmu &middot;</p>
        </header>

        <div class="cake-stage" id="cakeStage" role="button" tabindex="0" aria-label="Klik lilin untuk tiup lilin ulang tahun">
            <div class="cake-glow" id="cakeGlow"></div>

            <div class="candles" id="candles">
                <div class="candle">
                    <div class="flame"></div>
                    <div class="smoke"><i></i><i></i><i></i></div>
                    <div class="candle-body"></div>
                </div>
                <div class="candle">
                    <div class="flame"></div>
                    <div class="smoke"><i></i><i></i><i></i></div>
                    <div class="candle-body"></div>
                </div>
                <div class="candle candle--num">
                    <div class="flame flame--num"></div>
                    <div class="smoke"><i></i><i></i><i></i></div>
                    <div class="candle-num">17</div>
                </div>
                <div class="candle">
                    <div class="flame"></div>
                    <div class="smoke"><i></i><i></i><i></i></div>
                    <div class="candle-body"></div>
                </div>
                <div class="candle">
                    <div class="flame"></div>
                    <div class="smoke"><i></i><i></i><i></i></div>
                    <div class="candle-body"></div>
                </div>
            </div>

            <div class="cake-tier tier-top">
                <div class="frosting"></div>
                <div class="sprinkles"><i></i><i></i><i></i><i></i><i></i></div>
            </div>

            <div class="cake-tier tier-mid">
                <div class="frosting"></div>
                <div class="sprinkles"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
            </div>

            <div class="cake-tier tier-base">
                <div class="frosting"></div>
                <div class="sprinkles"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
            </div>

            <div class="cake-plate"></div>
        </div>

        <div class="blow-hint" id="blowHint">Klik lilin untuk tiup</div>

        <div class="wish-text" id="wishText"></div>
    </main>

    <script src="assets/js/pagecake.js"></script>
    <script src="assets/js/heart-bg.js"></script>
</body>
</html>
