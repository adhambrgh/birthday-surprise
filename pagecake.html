<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Birthday Cake</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Lato:wght@300;400;700&family=Great+Vibes&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/pagecake.css">
    <link rel="stylesheet" href="assets/css/next-button.css">
</head>
<body class="pagecake-body">
    <script src="assets/js/page-transition.js"></script>

    <div class="ambient-glow"></div>
    <div class="stars" id="stars"></div>

    <main class="page">
        <header class="header">
            <h1>Satu Permintaan</h1>
            <p>&middot; tiup lilinnya sayang &middot;</p>
        </header>

        <div class="cake-stage" id="cakeStage" role="button" tabindex="0" aria-label="Tiup lilin ulang tahun">
            <div class="cake-glow" id="cakeGlow"></div>

            <div class="candles" id="candles">
                <div class="candle" data-i="0">
                    <div class="flame"></div>
                    <div class="smoke"><i></i><i></i><i></i></div>
                    <div class="candle-body"></div>
                </div>
                <div class="candle" data-i="1">
                    <div class="flame"></div>
                    <div class="smoke"><i></i><i></i><i></i></div>
                    <div class="candle-body"></div>
                </div>
                <div class="candle" data-i="2">
                    <div class="flame"></div>
                    <div class="smoke"><i></i><i></i><i></i></div>
                    <div class="candle-body"></div>
                </div>
                <div class="candle" data-i="3">
                    <div class="flame"></div>
                    <div class="smoke"><i></i><i></i><i></i></div>
                    <div class="candle-body"></div>
                </div>
                <div class="candle" data-i="4">
                    <div class="flame"></div>
                    <div class="smoke"><i></i><i></i><i></i></div>
                    <div class="candle-body"></div>
                </div>
            </div>

            <div class="cake-top">
                <span class="sprinkle s1"></span><span class="sprinkle s2"></span>
                <span class="sprinkle s3"></span><span class="sprinkle s4"></span>
                <span class="sprinkle s5"></span><span class="sprinkle s6"></span>
            </div>
            <div class="cake-mid">
                <span class="sprinkle s1"></span><span class="sprinkle s2"></span>
                <span class="sprinkle s3"></span><span class="sprinkle s4"></span>
            </div>
            <div class="cake-base"></div>
            <div class="cake-plate"></div>
        </div>

        <div class="blow-hint" id="blowHint">Tiup lilinnya sayang! <span>👄</span></div>

        <div class="wish-text" id="wishText"></div>
    </main>

    <script src="assets/js/pagecake.js"></script>
    <script src="assets/js/heart-bg.js"></script>
</body>
</html>
